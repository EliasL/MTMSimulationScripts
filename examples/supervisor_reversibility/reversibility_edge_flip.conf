# Quick supervisor example: reversibility protocol with edge-flip reconnection.
name = supervisor_reversibility_edge_flip
rows = 50
cols = 50
usingPBC = true
reconnectionMethod = edgeFlip
reconnectRevert = true
reconnectEdgeLocking = false
experiment = reversibilityProtocolTest
nrThreads = 4
seed = 0
QDSD = 0.0
initialGuessNoise = 0.05
meshDiagonal = major
energyFunction = contiSquare
bulkModulus = 4

startLoad = 0.14
loadIncrement = 1e-4
maxLoad = 0.70

minimizer = LBFGS
epsR = 1e-5
LBFGSNrCorrections = 10
LBFGSScale = 1.0
LBFGSEpsg = 1e-8
LBFGSEpsf = 0.0
LBFGSEpsx = 1e-6
LBFGSMaxIterations = 0

logDuringMinimization = false
fullMinimizationLogging = false
writeDebugVTUs = false
writeDumps = true
writeMeshVTUs = true
nrVTUFrames = 100
plasticityEventThreshold = 0.01
energyDropThreshold = 1e-5
showProgress = 1
